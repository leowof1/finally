# Runs the app (mock LLM, fresh database) plus a Playwright container against it.
# Usage: docker compose -f test/docker-compose.test.yml up --build --abort-on-container-exit --exit-code-from e2e
services:
  finally:
    build: ..
    environment:
      LLM_MOCK: "true"
      MASSIVE_API_KEY: ""
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 2s
      retries: 30

  e2e:
    image: mcr.microsoft.com/playwright:v1.65.0-noble
    working_dir: /e2e
    environment:
      BASE_URL: http://finally:8000
    volumes:
      - ./:/e2e
      - /e2e/node_modules
    command: sh -c "npm ci && npx playwright test"
    depends_on:
      finally:
        condition: service_healthy
